<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slush Interim Pass — Mint</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#01060f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:420px;height:420px;background:radial-gradient(circle,rgba(75,173,239,0.13)0%,transparent 70%);top:-120px;left:-80px}
.orb2{width:340px;height:340px;background:radial-gradient(circle,rgba(0,200,180,0.08)0%,transparent 70%);bottom:-80px;right:-60px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(75,173,239,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(75,173,239,0.03)1px,transparent 1px);background-size:55px 55px}
.page{position:relative;z-index:1;width:100%;max-width:700px;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-wrap img{width:28px;height:28px;border-radius:7px}
.logo-wrap span{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,0.38)}
.live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:rgba(80,220,140,0.85);letter-spacing:.09em}
.ldot{width:6px;height:6px;border-radius:50%;background:#50dc8c;box-shadow:0 0 7px #50dc8c;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.main{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
/* LEFT */
.nft-img{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#0a1622;border:1px solid rgba(75,173,239,0.14);position:relative;margin-bottom:12px}
.nft-img img{width:100%;height:100%;object-fit:cover;display:block}
.nft-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(1,6,15,0.65)0%,transparent 50%)}
.nft-label{position:absolute;bottom:12px;left:13px}
.nft-name{font-family:'Cinzel',serif;font-size:14px;font-weight:900;color:#fff;letter-spacing:.03em}
.nft-sub{font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;letter-spacing:.05em}
.prog-wrap{background:rgba(255,255,255,0.03);border:1px solid rgba(75,173,239,0.12);border-radius:10px;padding:12px}
.prog-top{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-lbl{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:.12em}
.prog-val{font-size:11px;color:#4badef;font-weight:500}
.prog-bar{height:3px;background:rgba(75,173,239,0.1);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:34%;background:linear-gradient(90deg,#4badef,#00c8b4);border-radius:99px}
/* RIGHT */
.right{display:flex;flex-direction:column;gap:11px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ibox{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 12px}
.ilbl{font-size:9px;color:rgba(255,255,255,0.27);letter-spacing:.14em;margin-bottom:4px;text-transform:uppercase}
.ival{font-size:13px;color:rgba(255,255,255,0.8);font-weight:500}
.fee-box{background:rgba(75,173,239,0.07);border:1px solid rgba(75,173,239,0.18);border-radius:10px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}
.fl{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:.14em;margin-bottom:3px}
.ft{font-size:11px;color:rgba(255,255,255,0.32)}
.famount{font-family:'Cinzel',serif;font-size:26px;font-weight:600;color:#4badef}
.funit{font-size:11px;color:rgba(255,255,255,0.32);margin-left:3px}
.qty-row{display:flex;align-items:center;justify-content:space-between}
.qlbl{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:.13em}
.qctrl{display:flex;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;overflow:hidden}
.qbtn{width:34px;height:34px;background:transparent;border:none;color:rgba(255,255,255,0.7);font-size:20px;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;line-height:1}
.qbtn:hover{background:rgba(75,173,239,0.14)}
.qnum{width:36px;text-align:center;font-size:14px;font-weight:600;color:#fff}
.mint-btn{width:100%;padding:15px;background:#4badef;border:none;border-radius:10px;font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.18em;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;box-shadow:0 0 22px rgba(75,173,239,0.22)}
.mint-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);pointer-events:none}
.mint-btn:hover:not(:disabled){background:#3a9de0;box-shadow:0 0 34px rgba(75,173,239,0.38);transform:translateY(-1px)}
.mint-btn:disabled{background:rgba(75,173,239,0.28);cursor:not-allowed;box-shadow:none;transform:none}
.shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.08)50%,transparent 60%);transform:translateX(-100%);animation:shim 2.4s infinite}
@keyframes shim{to{transform:translateX(200%)}}
.status{text-align:center;font-size:11px;color:rgba(75,173,239,0.55);font-style:italic;min-height:16px;padding-top:3px}
.wrow{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;color:rgba(255,255,255,0.18);letter-spacing:.06em;padding-top:2px}
.wdot{width:5px;height:5px;border-radius:50%;border:1px solid rgba(75,173,239,0.3)}
</style>
</head>
<body>
<div class="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="grid"></div>
</div>

<div class="page">
  <div class="header">
    <div class="logo-wrap">
      <img id="logoImg" alt="Slush"/>
      <span>SLUSH</span>
    </div>
    <div class="live"><div class="ldot"></div>LIVE</div>
  </div>

  <div class="main">
    <div class="left">
      <div class="nft-img">
        <img id="nftImg" alt="Slush Interim Pass"/>
        <div class="nft-overlay"></div>
        <div class="nft-label">
          <div class="nft-name">Slush Interim Pass</div>
          <div class="nft-sub">SUI MAINNET · NFT</div>
        </div>
      </div>
      <div class="prog-wrap">
        <div class="prog-top">
          <span class="prog-lbl">MINTED</span>
          <span class="prog-val">3,401 / 9,999</span>
        </div>
        <div class="prog-bar"><div class="prog-fill"></div></div>
      </div>
    </div>

    <div class="right">
      <div class="info-grid">
        <div class="ibox"><div class="ilbl">Network</div><div class="ival">SUI Mainnet</div></div>
        <div class="ibox"><div class="ilbl">Supply</div><div class="ival">9,999</div></div>
        <div class="ibox"><div class="ilbl">Type</div><div class="ival">Waitlist Pass</div></div>
        <div class="ibox"><div class="ilbl">Remaining</div><div class="ival">6,598</div></div>
      </div>

      <div class="fee-box">
        <div>
          <div class="fl">MINT FEE</div>
          <div class="ft" id="ftotal">Total: 0.33 SUI</div>
        </div>
        <div>
          <span class="famount" id="famt">0.33</span>
          <span class="funit">SUI</span>
        </div>
      </div>

      <div class="qty-row">
        <span class="qlbl">QUANTITY</span>
        <div class="qctrl">
          <button class="qbtn" onclick="chg(-1)">−</button>
          <span class="qnum" id="qnum">1</span>
          <button class="qbtn" onclick="chg(1)">+</button>
        </div>
      </div>

      <button class="mint-btn" id="mintBtn" onclick="doMint()">
        <span class="shimmer"></span>
        <span id="btnTxt">MINT NOW</span>
      </button>

      <div class="status" id="status">Connect your Slush wallet to mint</div>

      <div class="wrow">
        <div class="wdot"></div>
        Compatible with Slush Wallet
        <div class="wdot"></div>
      </div>
    </div>
  </div>
</div>

var qty=1,going=false;
function chg(d){
  qty=Math.max(1,Math.min(10,qty+d));
  document.getElementById('qnum').textContent=qty;
  var t=(0.33*qty).toFixed(2);
  document.getElementById('famt').textContent=t;
  document.getElementById('ftotal').textContent='Total: '+t+' SUI';
}
function doMint(){
  if(going)return;
  going=true;
  var btn=document.getElementById('mintBtn');
  var s=document.getElementById('status');
  var t=document.getElementById('btnTxt');
  btn.disabled=true;
  t.textContent='CONNECTING…';
  s.textContent='Opening Slush wallet…';
  setTimeout(function(){t.textContent='CONFIRM IN WALLET…';s.textContent='Approve the transaction in Slush';},1200);
  setTimeout(function(){t.textContent='PROCESSING…';s.textContent='Submitting to SUI network…';},2600);
  setTimeout(function(){btn.disabled=false;t.textContent='MINT NOW';s.textContent='Connect your Slush wallet to mint';going=false;},4000);
}
</script>
